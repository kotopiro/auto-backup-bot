<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証成功 - Auto Backup Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="success-box">
            <div class="success-icon">✅</div>
            <h1>認証成功！</h1>
            <p class="username">ようこそ、<strong>{{ username }}</strong> さん</p>
            
            <div class="success-info">
                <h2>✨ 完了しました</h2>
                <p>あなたのアカウント情報が正常に登録されました。</p>
                <p>Botコマンドを使用してサーバーに参加できます。</p>
            </div>
            
            <div class="next-steps">
                <h3>📌 次のステップ</h3>
                <ol>
                    <li>Discordサーバーに戻る</li>
                    <li>Botのコマンドを確認する</li>
                    <li>バックアップ・復元機能を利用する</li>
                </ol>
            </div>
            
            <div class="actions">
                <a href="https://discord.com" class="btn btn-primary">Discordに戻る</a>
                <button onclick="window.close()" class="btn btn-secondary">このページを閉じる</button>
            </div>
            
            <div class="footer">
                <p>このウィンドウは自動的に閉じることができます</p>
            </div>
        </div>
    </div>
</body>
</html>
